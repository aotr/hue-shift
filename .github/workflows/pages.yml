name: Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: deploy docs
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the docs pages are well formed
        run: |
          set -euo pipefail
          test -f docs/index.html
          test -f docs/cli.html
          test -f docs/styles.css
          test -f docs/app.js
          node --check docs/app.js
          # The CLI page keeps its builder inline; make sure it parses.
          node -e '
            const fs = require("fs");
            const html = fs.readFileSync("docs/cli.html", "utf8");
            const m = html.match(/<script>([\s\S]*?)<\/script>/);
            if (!m) { console.error("no inline script found"); process.exit(1); }
            new Function(m[1]);
            console.log("cli.html inline script parses");
          '

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - id: deployment
        uses: actions/deploy-pages@v4
