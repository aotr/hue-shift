name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push cancels the previous run, so the macOS queue does not pile up.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 18
          - os: ubuntu-latest
            node: 20
          - os: ubuntu-latest
            node: 22
          - os: windows-latest
            node: 18
          - os: windows-latest
            node: 20
          - os: windows-latest
            node: 22
          # macOS runners are scarce; one modern Node proves the platform.
          - os: macos-latest
            node: 22
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Test
        run: npm test

  smoke:
    name: npx smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: CLI answers --version
        run: node bin/hue-shift.js --version

      - name: CLI colours a throwaway project
        run: |
          set -euo pipefail
          dir="$(mktemp -d)"
          node bin/hue-shift.js "$dir" --color amber
          test -f "$dir/.vscode/settings.json"
          grep -q "b45309" "$dir/.vscode/settings.json"
          node bin/hue-shift.js "$dir" --color amber --check
          node bin/hue-shift.js "$dir" --reset
          ! grep -q "workbench.colorCustomizations" "$dir/.vscode/settings.json"

      - name: dry run writes nothing
        run: |
          set -euo pipefail
          dir="$(mktemp -d)"
          node bin/hue-shift.js "$dir" --random --dry
          test ! -d "$dir/.vscode"
