name: Bug report
description: Something did not work as expected
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. A minimal reproduction is worth more than a long description.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: The exact command you ran, and the output.
      render: shell
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: hue-shift version
      description: Output of `npx hue-shift-cli --version`
      placeholder: 1.0.0
    validations:
      required: true

  - type: input
    id: node
    attributes:
      label: Node version
      description: Output of `node --version`
      placeholder: 22.22.0
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Linux
        - Windows
        - WSL
    validations:
      required: true

  - type: textarea
    id: settings
    attributes:
      label: Relevant settings.json
      description: Redact anything private. This helps more than anything else.
      render: jsonc

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues for the same problem.
          required: true
        - label: I can reproduce this in a fresh directory.
          required: false
