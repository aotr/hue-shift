name: Feature request
description: Suggest a flag, a behaviour, or a colour
title: "[feat] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the situation, not the solution. "I have 40 projects and cannot tell the dashboards apart" is more useful than "add a --dashboard flag".
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like it to do?
      description: A command line, a config key, or an expected output.

  - type: textarea
    id: alternatives
    attributes:
      label: What did you try instead?
      description: Other flags, Peacock, scripts, doing it by hand.

  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      description: hue-shift is a CLI that only edits settings.json. It has no extension host.
      options:
        - label: This can be done by writing settings.json, without the VS Code extension API.
          required: true
        - label: This does not require a new runtime dependency.
          required: true
